stages:
  data_preparation:
    cmd: python src/data_preparation.py
    deps:
      - src/data_preparation.py
      - src/config.py
      - data/raw/mtsamples.csv
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv
  tokenization:
    cmd: python src/tokenization.py --model distilbert-base-uncased --input data/processed --output data/tokenized --max_length 128
    deps:
      - src/tokenization.py
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv
    outs:
      - data/tokenized
  training:
    cmd: python src/train.py --model distilbert-base-uncased --data_dir data/tokenized --output_dir models/distilbert --epochs 3 --batch_size 8 --fp16
    deps:
      - src/train.py
      - data/tokenized
    outs:
      - models/distilbert
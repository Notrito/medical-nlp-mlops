stages:
  data_preparation:
    cmd: python src/data_preparation.py
    deps:
      - src/data_preparation.py
      - src/config.py
      - data/raw/mtsamples.csv
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv
  tokenization:
    cmd: python src/tokenization.py --model distilbert-base-uncased --input data/processed --output data/tokenized --max_length 128
    deps:
      - src/tokenization.py
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv
    outs:
      - data/tokenized
  training:
    cmd: python src/train.py --model ${train.model} --data_dir data/tokenized --output_dir models/distilbert --epochs ${train.epochs} --batch_size ${train.batch_size} --learning_rate ${train.learning_rate} --max_length ${train.max_length} --gradient_accumulation_steps ${train.gradient_accumulation_steps}
    deps:
      - src/train.py
      - data/tokenized
    params:
      - train
    outs:
      - models/distilbert